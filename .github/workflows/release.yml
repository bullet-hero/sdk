# Publishes BulletHero.SDK to nuget.org when an sv<X.Y.Z> tag is pushed, or by hand from the
# Actions tab (workflow_dispatch).
#
# No API key is stored anywhere: nuget.org's Trusted Publishing trades this job's GitHub OIDC token
# for a one-hour key (NuGet/login). The policy on nuget.org names this repository, this file
# (release.yml) and the `release` environment - rename any of them and publishing stops.
#
# The version is not an input. <Version> in BH.SDK.csproj, SdkVersion.cs and package.json must all
# say the same thing - and so must the tag, when a tag started the run - or the job fails before
# anything is built.
#
# A TAG RUN FAILS ON A VERSION ALREADY PUBLISHED; A MANUAL RUN SKIPS IT. A tag means "release this
# version", so a duplicate there is a forgotten bump and must be loud. A manual run is how the whole
# pipeline - checks, tests, pack, the OIDC exchange - is exercised without releasing anything, so
# pushing a version nuget.org already has is the expected outcome and --skip-duplicate makes it a
# no-op.
#
# A TAG RUN IS THE WHOLE RELEASE: after NuGet it creates the GitHub Release for the tag, carrying
# BH.SDK.dll out of the package just pushed and the tag's own `## sv X.Y.Z` section of CHANGELOG.md
# as its body. That section is read BEFORE anything is built, so a tag on a commit without one fails
# with nothing published. A manual run creates no release.

name: release

on:
  push:
    tags: [ 'sv*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the GitHub Release a tag run creates
      id-token: write # the OIDC token Trusted Publishing exchanges

    # AsyncDisciplineTests resolves its roots against the Unity project (the nearest folder holding
    # Assets/), so the SDK is checked out where the game keeps it. Without that it finds no root and
    # fails on purpose - a check that read nothing is not a pass.
    defaults:
      run:
        working-directory: Assets/Plugins/BH.SDK

    steps:
      - uses: actions/checkout@v4
        with:
          path: Assets/Plugins/BH.SDK

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Every copy of the version agrees
        run: |
          csproj=$(grep -oP '^\s*<Version>\K[^<]+(?=</Version>)' BH.SDK.csproj)
          code=$(grep -oP 'Value = "\K[^"]+' SdkVersion.cs)
          json=$(grep -oP '"version":\s*"\K[^"]+' package.json)
          echo "csproj=$csproj SdkVersion.cs=$code package.json=$json ref=$GITHUB_REF_TYPE/$GITHUB_REF_NAME"
          [ -n "$csproj" ] && [ "$csproj" = "$code" ] && [ "$csproj" = "$json" ] \
            || { echo "::error::The three copies of the version disagree - raise sv with the version-bump procedure"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#sv}" != "$csproj" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $csproj"; exit 1
          fi
          echo "VERSION=$csproj" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        run: |
          heading="## sv $VERSION"
          awk -v h="$heading" '
            index($0, h) == 1 && (length($0) == length(h) || substr($0, length(h) + 1, 1) == " ") { f = 1; next }
            f && /^## / { exit }
            f
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" \
            || { echo "::error::CHANGELOG.md has no '$heading' section - write it before tagging"; exit 1; }

      - name: Test
        run: dotnet test Tests/BH.SDK.Tests.csproj -c Release --filter "TestCategory!=5_extreme"

      - name: Pack
        run: dotnet pack BH.SDK.csproj -c Release -o "$RUNNER_TEMP/nupkg"

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        env:
          SKIP_DUPLICATE: ${{ github.event_name == 'workflow_dispatch' && '--skip-duplicate' || '' }}
        run: >
          dotnet nuget push "$RUNNER_TEMP/nupkg/BulletHero.SDK.${VERSION}.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          $SKIP_DUPLICATE

      # Skipped when the release already exists, so a re-run after a failure further down is safe.
      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"; exit 0
          fi
          unzip -j -o "$RUNNER_TEMP/nupkg/BulletHero.SDK.${VERSION}.nupkg" 'lib/*/BH.SDK.dll' -d "$RUNNER_TEMP/dll"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/dll/BH.SDK.dll" \
            --title "sv $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
